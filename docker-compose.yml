version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: farmdirect_db
    environment:
      POSTGRES_USER: farmuser
      POSTGRES_PASSWORD: farmpassword
      POSTGRES_DB: farmdirect_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: farmdirect_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://farmuser:farmpassword@postgres:5432/farmdirect_db
      - SECRET_KEY=demo-secret-key-change-in-production-farmdirect-ai
      - AI_PROVIDER=baseline
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: farmdirect_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:

